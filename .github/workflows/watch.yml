name: Volleyball Event Watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub kann das um einige Minuten verzögern)
  workflow_dispatch:          # manuelles Starten zum Testen

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Events prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_events.py

      - name: Zustand speichern
        run: |
          git config user.name "event-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
